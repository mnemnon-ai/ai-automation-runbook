name: Bug Report
about: Something isn't working as expected
description: Report a bug in the AI automation runbook
labels: ["bug"]
title: "Bug: "
body:
  - type: markdown
    attributes:
      value: |
        **Cost matters.** Before reporting, check if this is a budget/routing issue
        vs. a code bug. Share your LiteLLM spend metrics if relevant.
  - type: checkboxes
    id: searched
    attributes:
      label: Search existing issues
      description: Before opening a new issue, please search for similar reports
      options:
        - label: I searched existing issues and this hasn't been reported yet
          required: true
  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: A clear description of the bug
      validations:
        required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
      validations:
        required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
  - type: input
    id: python_version
    attributes:
      label: Python version
      placeholder: "e.g., Python 3.11.15"
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "e.g., macOS 13, Ubuntu 22.04"
  - type: textarea
    id: logs
    attributes:
      label: Error output / logs
      description: Paste relevant error messages or logs
      render: shell